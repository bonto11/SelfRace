name: Cron – apply subscription changes (PROD)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  

jobs:
  run-cron:
    runs-on: ubuntu-latest

    steps:
      - name: Call maintenance /app-subscriptions/apply-due (PROD)
        env:
          MAINTENANCE_API_KEY: ${{ secrets.MAINTENANCE_API_KEY_GITHUB }}
          API_BASE_URL_GITHUB: ${{ vars.API_BASE_URL_PROD_GITHUB }}
        run: |
          curl -X POST \
            -H "X-API-Key: $MAINTENANCE_API_KEY" \
            $API_BASE_URL_GITHUB/maintenance/app-subscriptions/apply-due