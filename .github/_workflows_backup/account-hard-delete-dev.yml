name: Account hard delete cron (DEV)

on:
  workflow_dispatch:

jobs:
  hard-delete:
    runs-on: ubuntu-latest

    steps:
      - name: Call backend account hard delete endpoint (DEV)
        env:
          MAINTENANCE_API_KEY: ${{ secrets.MAINTENANCE_API_KEY_GITHUB }}
          API_BASE_URL_GITHUB: ${{ vars.API_BASE_URL_DEV_GITHUB }}
        run: |
          curl -X POST \
            -H "X-API-Key: $MAINTENANCE_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"dry_run": false, "only_user_id": null}' \
            $API_BASE_URL_GITHUB/maintenance/account-hard-delete