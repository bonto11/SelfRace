name: Cleanup expired activity details (DEV)

on:
  workflow_dispatch:

jobs:
  run-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Call cleanup-expired-activity-details endpoint (DEV)
        env:
          MAINTENANCE_API_KEY: ${{ secrets.MAINTENANCE_API_KEY_GITHUB }}
          API_BASE_URL_GITHUB: ${{ vars.API_BASE_URL_DEV_GITHUB }}
        run: |
          set -e
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $MAINTENANCE_API_KEY" \
            -d '{}' \
            $API_BASE_URL_GITHUB/maintenance/cleanup-expired-activity-details