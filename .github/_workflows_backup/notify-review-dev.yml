name: Push Notify Review (Hourly) (DEV)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  run-review-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Call Review Push Endpoint (DEV)
        env:
          MAINTENANCE_API_KEY: ${{ secrets.MAINTENANCE_API_KEY_GITHUB }}
          API_BASE_URL_GITHUB: ${{ vars.API_BASE_URL_DEV_GITHUB }}
        run: |
          set -e
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $MAINTENANCE_API_KEY" \
            -d '{}' \
            $API_BASE_URL_GITHUB/notifications-timed/review
