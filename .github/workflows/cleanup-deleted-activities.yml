name: Cleanup deleted activities (dev)

on:
  # manuálne spustenie z GitHub UI
  workflow_dispatch:
  # denný cron – 03:00 UTC
  schedule:
    - cron: "0 3 * * *"

jobs:
  run-cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Call maintenance endpoint (dev)
        env:
          MAINTENANCE_API_KEY: ${{ secrets.MAINTENANCE_API_KEY }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $MAINTENANCE_API_KEY" \
            -d '{"cutoff_days": 1}' \
            https://api-dev.patrikmbontar.eu/maintenance/cleanup-deleted-activities