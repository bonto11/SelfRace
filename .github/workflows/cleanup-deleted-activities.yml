name: Cleanup deleted activities

on:
  workflow_dispatch:
  # denne 03:00 UTC
  schedule:
    - cron: "0 3 * * *"

jobs:
  run-cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Call maintenance endpoint
        env:
          MAINTENANCE_API_KEY: ${{ secrets.MAINTENANCE_API_KEY }}
          BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $MAINTENANCE_API_KEY" \
            -d '{"cutoff_days": 1}' \
            "$BACKEND_BASE_URL/maintenance/cleanup-deleted-activities"