name: Cleanup deleted activities

on:
  # manuálne spustenie z VS Code / GitHub UI
  workflow_dispatch:
  # denný cron – 03:00 UTC (u nás ~04:00 v zime, 05:00 v lete)
  schedule:
    - cron: "0 3 * * *"

jobs:
  run-cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Call maintenance endpoint
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${{ secrets.MAINTENANCE_API_KEY }}" \
            -d '{"cutoff_days": 1}' \
            $BACKEND_BASE_URL/maintenance/cleanup-deleted-activities
        env:
          MAINTENANCE_API_KEY: ${{ secrets.MAINTENANCE_API_KEY }}
          BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}