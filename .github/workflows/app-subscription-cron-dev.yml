name: Cron – apply subscription changes (DEV)

on:
  # raz denne o 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  run-cron:
    runs-on: ubuntu-latest

    steps:
      - name: Call maintenance /app-subscriptions/apply-due (DEV)
        env:
          MAINTENANCE_API_KEY: ${{ secrets.MAINTENANCE_API_KEY_GITHUB }}
          API_BASE_URL_GITHUB: ${{ vars.API_BASE_URL_DEV_GITHUB }}
        run: |
          curl -X POST \
            -H "X-API-Key: $MAINTENANCE_API_KEY" \
            $API_BASE_URL_GITHUB/maintenance/app-subscriptions/apply-due