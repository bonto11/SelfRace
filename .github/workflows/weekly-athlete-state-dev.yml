name: Weekly athlete state (DEV)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 0" 

jobs:
  run-weekly-athlete-state:
    runs-on: ubuntu-latest
    steps:
      - name: Call weekly athlete state endpoint (DEV)
        env:
          MAINTENANCE_API_KEY: ${{ secrets.MAINTENANCE_API_KEY_GITHUB }}
          API_BASE_URL_GITHUB: ${{ vars.API_BASE_URL_DEV_GITHUB }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $MAINTENANCE_API_KEY" \
            -d '{"max_users": 5}' \
            "$API_BASE_URL_GITHUB/maintenance/weekly-athlete-state-refresh"