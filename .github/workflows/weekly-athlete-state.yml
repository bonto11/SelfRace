name: Weekly athlete state

on:
  workflow_dispatch:
  # napr. každú stredu 20:00 UTC = 21:00 Bratislava (zima)
  schedule:
    - cron: "0 20 * * 3"

jobs:
  run-weekly-athlete-state:
    runs-on: ubuntu-latest

    steps:
      - name: Call weekly athlete state endpoint
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${{ secrets.MAINTENANCE_API_KEY }}" \
            -d '{"max_users": 5}' \
            $BACKEND_BASE_URL/maintenance/weekly-athlete-state-refresh
        env:
          MAINTENANCE_API_KEY: ${{ secrets.MAINTENANCE_API_KEY }}
          BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}