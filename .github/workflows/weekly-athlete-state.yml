name: Weekly athlete state

on:
  # manuálne spustenie z VS Code / GitHub UI
  workflow_dispatch:
  # týždenný cron – nedeľa 04:00 UTC (u nás cca 05:00 / 06:00)
  schedule:
    - cron: "0 20 * * 3"

jobs:
  run-weekly-athlete-state:
    runs-on: ubuntu-latest

    steps:
      - name: Call maintenance endpoint (weekly athlete state)
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${{ secrets.MAINTENANCE_API_KEY }}" \
            -d '{}' \
            https://api-dev.patrikmbontar.eu/maintenance/weekly-athlete-state