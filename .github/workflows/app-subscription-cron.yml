name: Cron – apply subscription changes

on:
  schedule:
    # teraz: každý deň 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  run-cron:
    runs-on: ubuntu-latest

    steps:
      - name: Call maintenance /app-subscriptions/apply-due
        env:
          MAINTENANCE_API_KEY: ${{ secrets.MAINTENANCE_API_KEY }}
          BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
        run: |
          curl -X POST \
            -H "X-API-Key: $MAINTENANCE_API_KEY" \
            "$BACKEND_BASE_URL/maintenance/app-subscriptions/apply-due"