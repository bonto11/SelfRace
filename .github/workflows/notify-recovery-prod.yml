name: Push Notify Recovery (11:00) (PROD)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

jobs:
  run-recovery-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Call Recovery Push Endpoint (PROD)
        env:
          MAINTENANCE_API_KEY: ${{ secrets.MAINTENANCE_API_KEY_GITHUB }}
          API_BASE_URL_GITHUB: ${{ vars.API_BASE_URL_PROD_GITHUB }}
        run: |
          set -e
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $MAINTENANCE_API_KEY" \
            -d '{}' \
            $API_BASE_URL_GITHUB/notifications-timed/recovery
